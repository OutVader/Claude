<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Índice maestro · Iñaki</title>
<style>
:root{
  --bg:#f6f7f9; --panel:#ffffff; --texto:#1c2330; --suave:#5b6577; --borde:#dde2ea;
  --acento:#2557d6; --acento-suave:#e8eefc; --ok:#1e7a46; --ok-bg:#e3f4ea; --curso:#8a5a00; --curso-bg:#fdf1d8;
  --pend:#5b6577; --pend-bg:#eceff4; --aviso:#b3261e; --aviso-bg:#fbe5e3; --codigo:#f0f2f6;

@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --bg:#11151c; --panel:#1a2029; --texto:#e4e8ef; --suave:#9aa5b8; --borde:#2c3442;
    --acento:#7aa2ff; --acento-suave:#1f2a44; --ok:#6fd39a; --ok-bg:#16301f; --curso:#f0c062; --curso-bg:#33280f;
    --pend:#9aa5b8; --pend-bg:#242b36; --aviso:#ff8a80; --aviso-bg:#3a1c1a; --codigo:#232a35;
  }
}
:root[data-theme="dark"]{
  --bg:#11151c; --panel:#1a2029; --texto:#e4e8ef; --suave:#9aa5b8; --borde:#2c3442;
  --acento:#7aa2ff; --acento-suave:#1f2a44; --ok:#6fd39a; --ok-bg:#16301f; --curso:#f0c062; --curso-bg:#33280f;
  --pend:#9aa5b8; --pend-bg:#242b36; --aviso:#ff8a80; --aviso-bg:#3a1c1a; --codigo:#232a35;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--texto);font:15px/1.5 "Segoe UI",system-ui,-apple-system,Roboto,sans-serif}
header{position:sticky;top:0;z-index:5;background:var(--panel);border-bottom:1px solid var(--borde);padding:12px 16px}
.cab{max-width:1150px;margin:0 auto;display:flex;flex-wrap:wrap;gap:10px;align-items:center}
h1{font-size:19px;margin:0 12px 0 0}
.meta{color:var(--suave);font-size:13px}
#buscar{flex:1 1 260px;min-width:0;padding:8px 12px;border:1px solid var(--borde);border-radius:8px;background:var(--bg);color:var(--texto);font-size:15px}
.chips{max-width:1150px;margin:8px auto 0;display:flex;flex-wrap:wrap;gap:6px}
.chip{white-space:nowrap;flex:0 0 auto;border:1px solid var(--borde);background:var(--bg);color:var(--texto);border-radius:999px;padding:3px 11px;font-size:13px;cursor:pointer}
.chip[aria-pressed="true"]{background:var(--acento);border-color:var(--acento);color:#fff}
button.btn{border:1px solid var(--borde);background:var(--bg);color:var(--texto);border-radius:6px;padding:3px 9px;font-size:12.5px;cursor:pointer}
button.btn:hover,a.btn:hover{border-color:var(--acento)}
a.btn{display:inline-block;border:1px solid var(--borde);border-radius:6px;padding:3px 9px;font-size:12.5px;text-decoration:none;color:var(--acento);background:var(--acento-suave)}
main{max-width:1150px;margin:0 auto;padding:14px 16px 60px}
details.sec{background:var(--panel);border:1px solid var(--borde);border-radius:10px;margin:12px 0;overflow:hidden}
details.sec>summary{cursor:pointer;padding:11px 14px;font-weight:600;font-size:16px;list-style:none;display:flex;gap:8px;align-items:center}
details.sec>summary::-webkit-details-marker{display:none}
details.sec>summary::before{content:"▸";color:var(--suave);transition:transform .15s}
details.sec[open]>summary::before{transform:rotate(90deg)}
.cuenta{color:var(--suave);font-weight:400;font-size:13px}
.desc-sec{color:var(--suave);font-size:13px;padding:0 14px 6px;margin-top:-4px}
.lista{display:grid;grid-template-columns:minmax(0,1fr);gap:8px;padding:4px 12px 12px}
.item{border:1px solid var(--borde);border-radius:8px;padding:9px 11px;background:var(--bg)}
.fila1{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.nombre{font-weight:600}
.estado{font-size:12px;border-radius:999px;padding:1px 9px;white-space:nowrap}
.e-ok{background:var(--ok-bg);color:var(--ok)} .e-curso{background:var(--curso-bg);color:var(--curso)}
.e-pend{background:var(--pend-bg);color:var(--pend)} .e-aviso{background:var(--aviso-bg);color:var(--aviso)}
.tipo{font-size:11.5px;color:var(--suave);border:1px dashed var(--borde);border-radius:4px;padding:0 6px}
.texto{color:var(--suave);font-size:13.5px;margin:3px 0 0}
.enlaces{display:flex;flex-direction:column;gap:5px;margin-top:7px}
.enl{display:grid;grid-template-columns:150px minmax(0,1fr) auto;gap:6px 8px;align-items:center;font-size:13px}
.enl .et{color:var(--suave)}
.enl .acc{display:flex;gap:5px;flex-wrap:nowrap}
.enl>a.btn{justify-self:start;max-width:100%;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
code.ruta{background:var(--codigo);border-radius:5px;padding:1px 6px;font:12.5px Consolas,"Cascadia Mono",monospace;overflow-wrap:anywhere}
pre.cmd{margin:6px 0 0;background:var(--codigo);border-radius:6px;padding:8px 10px;font:12.5px/1.45 Consolas,"Cascadia Mono",monospace;white-space:pre-wrap;overflow-wrap:anywhere}
.oculto{display:none!important}
.vacio{color:var(--suave);padding:20px;text-align:center}
.toast{position:fixed;bottom:18px;left:50%;transform:translateX(-50%);background:var(--texto);color:var(--bg);padding:7px 14px;border-radius:8px;font-size:13px;opacity:0;transition:opacity .2s;pointer-events:none}
.toast.ver{opacity:.95}
.pie{color:var(--suave);font-size:12.5px;margin-top:22px}
mark{background:#ffe58a;color:#1c2330;border-radius:2px}
@media (max-width:640px){ .enl{grid-template-columns:minmax(0,1fr) auto} .enl .et{grid-column:1/-1;margin-bottom:-4px} h1{font-size:17px} .chips{flex-wrap:nowrap;overflow-x:auto;padding-bottom:2px} }
@media print{ header{position:static} .btn,.chips,#buscar{display:none} details.sec{break-inside:avoid} }
</style>
</head>
<body>

  <div class="cab">

    <span class="meta" id="meta"></span>

    <button class="btn" id="abrirTodo">Abrir todo</button>
    <button class="btn" id="cerrarTodo">Cerrar todo</button>
    <button class="btn" id="tema" title="Cambiar tema">◐ Tema</button>
  </div>
  <div class="chips" id="chips"></div>
</header>
<main id="main"></main>

<script>
(function(){
  const $ = s => document.querySelector(s);
  const ESTADO = {ok:'e-ok', curso:'e-curso', pend:'e-pend', aviso:'e-aviso'};
  const guardar = (k,v)=>{ try{ localStorage.setItem('indice.'+k, JSON.stringify(v)); }catch(e){} };
  const leer = (k,d)=>{ try{ const v=localStorage.getItem('indice.'+k); return v===null?d:JSON.parse(v); }catch(e){ return d; } };

  // C:\a b\#1 -> file:///C:/a%20b/%231   ;  \\srv\rec -> file://srv/rec
  function aFile(r){
    const unc = r.startsWith('\\\\');
    const partes = r.replace(/^\\\\/,'').split('\\').map((p,i)=> (i===0 && !unc) ? p : encodeURIComponent(p));
    return unc ? 'file://' + partes.join('/') : 'file:///' + partes.join('/');
  }
  function el(tag, attrs, ...hijos){
    const n = document.createElement(tag);
    for (const [k,v] of Object.entries(attrs||{})) { if (k==='class') n.className=v; else if (k==='text') n.textContent=v; else n.setAttribute(k,v); }
    for (const h of hijos) if (h) n.append(h);
    return n;
  }
  function toast(t){ const x=$('#toast'); x.textContent=t; x.classList.add('ver'); clearTimeout(toast.t); toast.t=setTimeout(()=>x.classList.remove('ver'),1400); }
  async function copiar(t){
    try { await navigator.clipboard.writeText(t); }
    catch(e){ const a=el('textarea'); a.value=t; document.body.append(a); a.select(); try{document.execCommand('copy');}catch(_){} a.remove(); }
    toast('Copiado');
  }

  function pintarEnlace(e){
    const fila = el('div',{class:'enl'}, el('span',{class:'et',text:e.et}));
    if (e.ruta){
      const b=el('button',{class:'btn',type:'button',text:'Copiar'}); b.onclick=()=>copiar(e.ruta);
      fila.append(el('code',{class:'ruta',text:e.ruta}), el('span',{class:'acc'}, el('a',{class:'btn',href:aFile(e.ruta),target:'_blank',rel:'noopener',text:'Abrir'}), b));
    } else if (e.url){
      fila.append(el('a',{class:'btn',href:e.url,target:'_blank',rel:'noopener',text:e.url.replace(/^https?:\/\//,'')}));
    } else if (e.cmd){
      const b=el('button',{class:'btn',type:'button',text:'Copiar'}); b.onclick=()=>copiar(e.cmd);
      if (e.cmd.includes('\n')) { fila.append(el('span',{}), el('span',{class:'acc'},b)); return el('div',{}, fila, el('pre',{class:'cmd',text:e.cmd})); }
      fila.append(el('code',{class:'ruta',text:e.cmd}), el('span',{class:'acc'},b));
    }
    return fila;
  }

  const tipos = new Set();
  const main = $('#main');
  const abiertas = leer('abiertas', null);
  INDICE.secciones.forEach(s=>{
    const det = el('details',{class:'sec',id:'sec-'+s.id});
    if (abiertas===null || abiertas.includes(s.id)) det.open = true;
    det.addEventListener('toggle',()=>guardar('abiertas',[...document.querySelectorAll('details.sec')].filter(d=>d.open).map(d=>d.id.slice(4))));
    const cuenta = el('span',{class:'cuenta'});
    det.append(el('summary',{}, document.createTextNode(s.titulo+' '), cuenta));
    if (s.desc) det.append(el('div',{class:'desc-sec',text:s.desc}));
    const lista = el('div',{class:'lista'});
    s.items.forEach(it=>{
      tipos.add(it.tipo);
      const f1 = el('div',{class:'fila1'}, el('span',{class:'nombre',text:it.nombre}), el('span',{class:'tipo',text:it.tipo}));
      if (it.estado) f1.append(el('span',{class:'estado '+(ESTADO[it.estado]||'e-pend'),text:it.estadoTxt||it.estado}));
      const card = el('div',{class:'item','data-tipo':it.tipo}, f1);
      if (it.texto) card.append(el('p',{class:'texto',text:it.texto}));
      if (it.enlaces && it.enlaces.length) card.append(el('div',{class:'enlaces'}, ...it.enlaces.map(pintarEnlace)));
      card.dataset.busca = [it.nombre,it.tipo,it.estadoTxt,it.texto,...(it.enlaces||[]).map(e=>[e.et,e.ruta,e.url,e.cmd].join(' '))].join(' ').toLowerCase();
      lista.append(card);
    });
    det.append(lista); main.append(det);
  });
  main.append(el('div',{class:'vacio oculto',id:'vacio',text:'Nada coincide con la búsqueda.'}));
  main.append(el('p',{class:'pie',text:'Para actualizar: edita el bloque INDICE (arriba del todo en el código), cambia "actualizado" y añade una línea en el historial. Las rutas de Windows se convierten solas en enlaces file:///.'}));
  $('#meta').textContent = 'v'+INDICE.version+' · actualizado '+INDICE.actualizado;

  // Filtros por tipo
  let activos = new Set(leer('tipos', []));
  const chips = $('#chips');
  const chipTodo = el('button',{class:'chip',type:'button',text:'Todo'});
  chips.append(chipTodo);
  const chipEls = [...tipos].map(t=>{ const c=el('button',{class:'chip',type:'button',text:t}); c.onclick=()=>{ activos.has(t)?activos.delete(t):activos.add(t); aplicar(); }; chips.append(c); return [t,c]; });
  chipTodo.onclick=()=>{ activos.clear(); aplicar(); };

  const buscar = $('#buscar');
  function aplicar(){
    guardar('tipos',[...activos]);
    chipTodo.setAttribute('aria-pressed', activos.size? 'false':'true');
    chipEls.forEach(([t,c])=>c.setAttribute('aria-pressed', activos.has(t)?'true':'false'));
    const q = buscar.value.trim().toLowerCase().split(/\s+/).filter(Boolean);
    let total=0;
    document.querySelectorAll('details.sec').forEach(d=>{
      let n=0, tot=0;
      d.querySelectorAll('.item').forEach(c=>{
        tot++;
        const ok = (!activos.size || activos.has(c.dataset.tipo)) && q.every(w=>c.dataset.busca.includes(w));
        c.classList.toggle('oculto',!ok); if(ok) n++;
      });
      d.classList.toggle('oculto', n===0);
      d.querySelector('.cuenta').textContent = (n===tot? '('+tot+')' : '('+n+' de '+tot+')');
      if (q.length && n) d.open = true;
      total+=n;
    });
    $('#vacio').classList.toggle('oculto', total>0);
  }
  buscar.addEventListener('input', aplicar);
  document.addEventListener('keydown', e=>{ if(e.key==='/' && document.activeElement!==buscar){ e.preventDefault(); buscar.focus(); } if(e.key==='Escape'){ buscar.value=''; aplicar(); } });
  $('#abrirTodo').onclick=()=>document.querySelectorAll('details.sec').forEach(d=>d.open=true);
  $('#cerrarTodo').onclick=()=>document.querySelectorAll('details.sec').forEach(d=>d.open=false);

  // Tema
  const raiz=document.documentElement; const t0=leer('tema',null); if(t0) raiz.dataset.theme=t0;
  $('#tema').onclick=()=>{ const oscuro = raiz.dataset.theme ? raiz.dataset.theme==='dark' : matchMedia('(prefers-color-scheme: dark)').matches; raiz.dataset.theme = oscuro?'light':'dark'; guardar('tema',raiz.dataset.theme); };
  aplicar();
})();
</script>
